<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNE — Motion Not Emotion</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">MNE</div>

    <nav>
      <a href="#shop">Shop</a>
      <a href="#about">About</a>

  <main>

    <section class="hero">
      <p class="small-text">MOTION NOT EMOTION</p>

      <h1>MOVE<br>DIFFERENT.</h1>

      <p>Streetwear built for people who keep moving.</p>

      <a href="#shop" class="button">SHOP THE DROP</a>
    </section>

    <section id="shop" class="shop">
      <h2>FEATURED DROP</h2>

      <div class="product">
        <div class="product-image">
          MNE
        </div>

        <h3>MNE Signature Tee</h3>
        <p>GH₵180</p>

        <button>ADD TO CART</button>
      </div>
    </section>

    <section id="about" class="about">
      <h2>ABOUT MNE</h2>
      <p>
        Motion Not Emotion.
        Keep moving. Keep building. Keep becoming.
      </p>
    </section>

  </main>

  <footer>
    <p>© 2026 MNE — Motion Not Emotion</p>
  </footer>

</body>
</html>
